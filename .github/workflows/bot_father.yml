name: BotFather

on:
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:    
    - name: Version Tag
      id: version_tag
      run: |
        echo Version: ${GITHUB_REF_NAME#v}
        echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Step ok
      run: |
        echo ok

    # - name: Step fail 1
    #   run: exit 1
    # - name: Step fail 2
    #   run: exit 1
    #   # continue-on-error: true # Allows subsequent steps to run

    - name: Step ok
      run: |
        echo ${{ github.repository }}
        echo ok

    - name: Tg Release failed
      id: tg_failed
      if: ${{ failure() }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        disable_web_page_preview: true
        message: |
          🔴 Android ${{ steps.version_tag.outputs.VERSION }} release failed

          [Failed Github Action](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

    - name: Tg Release
      id: tg_success
      if: ${{ success() }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        disable_web_page_preview: true
        message: |
          🟢 Android ${{ steps.version_tag.outputs.VERSION }} release

          [README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)
    
    - name: Step ok2
      run: |
        echo ok2