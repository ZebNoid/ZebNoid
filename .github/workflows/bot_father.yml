name: BotFather

on:
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
    - name: send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          Send message from ${{ github.repository }}.
    
    # - name: Step that might fail
    #   run: exit 1
      # continue-on-error: true # Allows subsequent steps to run

    - name: Step ok
      run: |
        echo ok

    - name: failure message
      if: ${{ failure() }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🔴 Android build failed ${GITHUB_REF_NAME#v} ${{ github.ref_name }}

    - name: failure message
      if: ${{ success() }}
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🟢 Android success ${GITHUB_REF_NAME#v} ${{ github.ref_name }}
    
    - name: Step ok2
      run: |
        echo ok2